<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    {% if preview_base %}
    <base href="{{ preview_base }}">{% endif %}
    <title>{{ title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="S.P.F. Base Wiki - {{ title }}">
    <meta property="og:type" content="article">

    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

    {% include "wiki_styles.html" %}
</head>

<body {% if block_palette %}data-block-palette="true" {% endif %} {% if component_preview
    %}data-component-preview="true" {% endif %} {% if background_url %}
    style="--wiki-bg-image: url('{{ background_url | ver }}');" {% endif %}>
    <div class="page">

        {% include "wiki_header.html" %}

        <div class="layout">

            <aside class="toc-panel">
                <nav class="toc-nav">
                    <a href="javascript:history.back()">← Назад</a>
                    <span class="sep">•</span>
                    <a href="/">На главную</a>
                </nav>
            </aside>

            <main class="content">
                {{ content | safe }}
            </main>

        </div>

        <footer class="footer">
            SPF Wiki
        </footer>

    </div>

    <script src="{{ 'js/render/images.js' | ver }}" data-fallback="{{ 'images/placeholder.svg' | ver }}"></script>
    {% if preview_base %}
    <script src="{{ 'js/editor-frame.js' | ver }}"></script>
    <script src="{{ 'js/editor-frame-source.js' | ver }}"></script>
    {% endif %}
    <script src="{{ 'js/render/scroll.js' | ver }}"></script>
    {% if not preview_base %}
    <script src="{{ 'js/render/search.js' | ver }}"></script>
    {% endif %}
    <script src="{{ 'js/render/toc.js' | ver }}"></script>
    <script src="{{ 'js/render/link-preview.js' | ver }}"></script>
    <script src="{{ 'js/render/aiuse.js' | ver }}"></script>
</body>

</html>
