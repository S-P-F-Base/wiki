name: Normalize wiki

on:
  push:
    branches:
      - master
    paths:
      - "wiki/**/*.md"
      - "wiki/*.md"

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: normalize-wiki-master
  cancel-in-progress: false

jobs:
  normalize:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip normalize]')

    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR number
        if: github.event_name == 'workflow_dispatch'
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          MERGED_AT="$(jq -r '.merged_at' <<< "$PR_JSON")"

          if [[ "$MERGED_AT" == "null" ]]; then
            echo "::error::PR #${PR_NUMBER} is not merged"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get files changed by PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' \
            > changed_files.txt

          echo "Files from merged PR #${PR_NUMBER}:"
          cat changed_files.txt

      - name: Normalize wiki
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/normalize_wiki.py

      - name: Check changes
        id: changes
        run: |
          rm -f changed_files.txt

          git add -- wiki

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to normalize."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Normalization changes:"
            git diff --cached --stat
          fi

      - name: Commit and push to master
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$PR_NUMBER" ]]; then
            NORMALIZE_SOURCE="#${PR_NUMBER}"
          else
            NORMALIZE_SOURCE="${GITHUB_SHA:0:7}"
          fi

          git commit -m "normalize wiki after ${NORMALIZE_SOURCE} [skip normalize]"
          git push origin master
