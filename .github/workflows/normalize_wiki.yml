name: Normalize wiki

on:
  pull_request:
    types:
      - closed

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: normalize-wiki-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  normalize-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          STATE="$(jq -r '.state' <<< "$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<< "$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"

          if [[ "$STATE" != "open" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open"
            exit 1
          fi

          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::PR #${PR_NUMBER} is from another repository"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get files changed by PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' \
            > changed_files.txt

          echo "Changed files in PR #${PR_NUMBER}:"
          cat changed_files.txt

      - name: Run normalizer
        run: |
          python3 scripts/normalize_wiki.py

      - name: Check changes
        id: changes
        run: |
          rm -f changed_files.txt

          git add -- wiki

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to normalize."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit normalization into PR
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "normalize wiki for #${PR_NUMBER}"

          git push origin "HEAD:${HEAD_REF}"

  normalize-master:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get files changed by merged PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' \
            > changed_files.txt

          echo "Changed files in merged PR #${PR_NUMBER}:"
          cat changed_files.txt

      - name: Run normalizer
        run: |
          python3 scripts/normalize_wiki.py

      - name: Check changes
        id: changes
        run: |
          rm -f changed_files.txt

          git add -- wiki

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to normalize."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push to master
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "normalize wiki after #${PR_NUMBER}"

          git push origin master
