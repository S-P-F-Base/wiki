name: Normalize wiki

on:
  pull_request:
    types:
      - closed

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: normalize-wiki-master
  cancel-in-progress: false

jobs:
  normalize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$MANUAL_PR_NUMBER"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
          fi

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          MERGED_AT="$(jq -r '.merged_at' <<< "$PR_JSON")"

          if [[ "$MERGED_AT" == "null" ]]; then
            echo "::error::PR #${PR_NUMBER} is not merged"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get files changed by PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' \
            > changed_files.txt

          echo "Files from merged PR #${PR_NUMBER}:"
          cat changed_files.txt

      - name: Normalize wiki
        run: |
          python3 scripts/normalize_wiki.py

      - name: Check changes
        id: changes
        run: |
          rm -f changed_files.txt

          git add -- wiki

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to normalize."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Normalization changes:"
            git diff --cached --stat
          fi

      - name: Commit and push to master
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "normalize wiki after #${PR_NUMBER}"
          git push origin master
