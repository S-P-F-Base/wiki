name: Normalize wiki

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: normalize-wiki-master
  cancel-in-progress: false

jobs:
  normalize-wiki:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get merged PR files
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' \
            > changed_files.txt

          echo "Files from PR #${PR_NUMBER}:"
          cat changed_files.txt

      - name: Normalize wiki
        run: |
          python3 scripts/normalize_wiki.py

      - name: Check changes
        id: changes
        run: |
          rm -f changed_files.txt

          git add -- wiki

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No normalization changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Normalization changes:"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "normalize wiki after #${PR_NUMBER}"
          git push origin master
